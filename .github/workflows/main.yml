  }
}

class Ilan {
  final String baslik;
  final String kpssPuan;
  final String kontenjan;
  final String dilSarti;
  final String calismaYeri;
  final String avantaj;
  final String dezavantaj;
  final String ozluk;

  Ilan({
    required this.baslik,
    required this.kpssPuan,
    required this.kontenjan,
    required this.dilSarti,
    required this.calismaYeri,
    required this.avantaj,
    required this.dezavantaj,
    required this.ozluk,
  });
}

